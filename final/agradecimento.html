


<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Obrigado!</title>
      <link rel="icon" href="favicon.ico">

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #4CAF50, #FFEB3B);
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      overflow: hidden; /* evita barra de rolagem com confete */
    }

    h1 {
      font-size: 3em;
      animation: fadeIn 2s ease-in-out, bounce 2s infinite alternate;
    }

    p {
      font-size: 1.5em;
      animation: fadeIn 3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-15px); }
    }
  </style>
</head>
<body>
  <div>
    <h1>🎉 Obrigado pelo contato!</h1>
    <p>Recebemos sua mensagem e entraremos em contato em breve.</p>
  </div>

  <!-- Importa a biblioteca de confete -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <script>
    // Dispara confete ao carregar a página
    confetti({
      particleCount: 150,
      spread: 70,
      origin: { y: 0.6 }
    });

    // Efeito extra: confete contínuo por alguns segundos
    let duration = 10 * 1000; // 10 segundos
    let end = Date.now() + duration;

    (function frame() {
      confetti({
        particleCount: 5,
        angle: 60,
        spread: 55,
        origin: { x: 0 }
      });
      confetti({
        particleCount: 5,
        angle: 120,
        spread: 55,
        origin: { x: 1 }
      });

      if (Date.now() < end) {
        requestAnimationFrame(frame);
      }
    }());
  </script>
</body>
</html>
